# Sampling parameters are independent and are loaded at application startup.
# SimulationSampleSeconds: fixed simulated seconds per calculation step.
# Recommended: 0.1 s. Accepted software range: 0.001-1 s.
# Simulation acceleration applies only to the simulated clock, never to real IO.
SimulationSampleSeconds=0.1

# RealIoSamplePeriodSeconds: target acquisition period in actual seconds.
# Recommended starting value: 0.1 s. Assess 0.1-0.5 s for a slow water tank.
# Accepted software range: 0.001-60 s; assess actual hardware and process timing.
# Real IO PID updates use measured intervals between valid samples, not this target.
# This parameter does not enable an IO driver or a hardware control mode.
RealIoSamplePeriodSeconds=0.1
